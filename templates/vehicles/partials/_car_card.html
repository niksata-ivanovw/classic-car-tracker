{% load vehicle_tags %}

<div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column"></div>
            <h5 class="card-titile text-primary mb-1">
                {{ car.manufacture_year }} {{ car.manufacture.name }} {{ car.model_name }}
            </h5>
        <p class="card-text text-muted mb-2">
            <small><strong>VIN:</strong> {{ car.vin|mask_vin }}</small>
        </p>

        <p class="card-text mb-2">
            <strong>Restoration Budget:</strong>
            <span class="text-success fw-bold">{{ car|total_parts_cost }}</span>
        </p>

        <div class="mb-3">
            {% restoration_status_badge car as badge %}
            {{ badge|safe }}
        </div>

        <div class="mt-auto">
            <a href="{% url 'vehicles:car-detail' car.pk %}" class="btn btn-outline-primary btn-sm w-100">View Details</a>
        </div>


    </div>
</div>
