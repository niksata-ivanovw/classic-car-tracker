{% extends 'base.html' %}
{% load vehicle_tags  %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Classic Cars Catalog</h2>
    <a href="{% url 'vehicles:car-create' %}" class="btn btn-primary">Add New Car</a>
</div>

    <div class="row">
    {% for car in cars %}
        {% include 'vehicles/partials/_car_card.html' with car=car %}
    {% empty %}
        <div class="col-12">
            <div class="alert alert-warning">No classic cars in the catalog yet.</div>
        </div>
    {% endfor %}
    </div>
{% endblock %}
