{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 mt-4">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">{% if object %}Edit Classic Car{% else %}Add New Classic Car{% endif %}</h3>
            </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success mt-3">Save Classic Car</button>
                <a href="{% url 'vehicles:car-list' %}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
        </div>
    </div>
</div>
{% endblock %}
