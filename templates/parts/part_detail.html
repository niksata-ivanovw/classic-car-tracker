{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm mt-4">
    <div class="card-header bg-info text-white">
        <h3 class="mb-0">{{ part.name }}</h3>
    </div>
    <div class="card-body">
        <p><strong>Part Number:</strong> {{ part.part_number }}</p>
        <p><strong>Price:</strong> ${{ part.price }}</p>

        <div class="mt-3">
            <a href="{% url 'parts:part-edit' part.pk %}" class="btn btn-warning">Edit Part</a>
            <a href="{% url 'parts:part-delete' part.pk %}" class="btn btn-danger">Delete Part</a>
            <a href="{% url 'parts:part-list' %}" class="btn btn-secondary">Back to Inventory</a>
        </div>
    </div>
</div>
{% endblock %}
